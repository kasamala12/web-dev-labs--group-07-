<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact page</title>

</head>
<body>
    <h1>contact us</h1>

    <h2>Basic Contact Form</h2>

    <form>
        Name:<br>
        <input type="text" name="name"><br><br>

        Email:<br>
        <input type="email" name="email"><br><br>

        Message:<br>
        <textarea name="message" rows="5" cols="30"></textarea><br><br>

        <input type="submit" value="send message"
    </form>

    <h2>Student Registration Form</h2>
    <form>
        <table border="1" cellpadding="10">
            <tr>
                <td>Full Name:</td>
                <td><input type="text" name="fullname" required></td>
            </tr>

            <tr>
                <td>Email:</td>
                <td><input type="email" name="email" required></td>
            </tr>

            <tr>
                <td>Password:</td>
                <td><input type="password" name="password" required></td>

            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="gender" value="male">male
                    <input type="radio" name="gender" value="female">female 
                </td>
            </tr>

            <tr>
                <td>Course:</td>
                <td>
                    <input type="checkbox" name="course" value="html">HTML<br>
                    <input type="checkbox" name="course" value="css">CSS<br>
                    <input type="checkbox" name="course" value="js">JavaScript
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Register">
                </td>
            </tr>
        </table>
    </form>

    <br>

    <a href="index.html">Back to Home</a><br><br>
    <a href="timetable.html">Go to timetable</a>
    
</body>
</html>
